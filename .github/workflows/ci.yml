name: VietStream CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-test:
    name: Verify NodeJS Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.js
          node --check src/mobile-app.js
          node --check src/hls-proxy.js
          node --check src/config.js

      - name: Test Server Startup & Endpoints
        run: |
          npm start > /tmp/vietstream-server.log 2>&1 &
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:7001/app > /dev/null
          curl --fail http://localhost:7001/manifest.json > /dev/null

  build-android-apk:
    name: Build Android APK
    needs: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/VietStream-latest-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietStream-latest-debug-apk
          path: build-outputs/VietStream-latest-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release (Only on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.6-$(date +'%Y%m%d%H%M')"
          gh release create "$TAG_NAME" build-outputs/VietStream-latest-debug.apk \
            --target "$GITHUB_SHA" \
            --title "VietStream Android Release ($TAG_NAME)" \
            --notes "Bản build tự động từ GitHub Actions: Cải thiện mượt mà video HLS, giữ nguyên kết quả tìm kiếm/trạng thái trang, và khóa xoay màn hình thông minh." \
            --latest
