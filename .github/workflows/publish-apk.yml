name: Publish Android APK

on:
  push:
    branches: [main]
    paths:
      - 'downloads/VietStream-v1.5-debug.apk'
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5 downloads/VietStream-v1.5-debug.apk \
            --target "$GITHUB_SHA" \
            --title "VietStream Android v1.5" \
            --notes "Giữ nguyên phim khi xoay máy, hỗ trợ bốn hướng màn hình trong chế độ toàn màn hình. APK debug để cài trực tiếp trên điện thoại Android." \
            --prerelease

