name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --check server.js && node --check src/mobile-app.js
      - name: Check web app and API
        run: |
          npm start > /tmp/vietstream-server.log 2>&1 &
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:7001/app > /dev/null
          curl --fail http://localhost:7001/manifest.json > /dev/null

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vietstream-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
